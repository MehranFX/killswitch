<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link href="https://fonts.googleapis.com/css?family=Dosis" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="../css/options.css" />
  </head>
  <body>
    <div align="center" id="message"></div>
    <div id="content" style="max-width: 640px; margin: 0 auto;">
      <h2>Settings</h2>
      <div class="rule-item" style="text-align:left;">
        <p>
          <strong>Fallback Proxy (optional)</strong><br>
          <input id="fallback_proxy" placeholder="e.g., PROXY 127.0.0.1:8080 or SOCKS5 127.0.0.1:1080" style="width:100%;" />
          <small>If system/browser has a proxy, the extension will auto-detect and use it. This field is optional and used only if system proxy is fixed and not detectable.</small>
        </p>
      </div>
      <div class="rule-item" style="text-align:left;">
        <p>
          <strong>WebRTC Leak Protection</strong><br>
          <label style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="webrtc_protect" />
            <span>Prevent WebRTC IP leakage (replace/enforce mDNS)</span>
          </label>
          <small>When enabled, the extension will try to minimize local IP exposure via WebRTC.</small>
        </p>
      </div>
      <div align="center">
        <button id="save_settings">Save</button>
      </div>
    </div>
    <script type="text/javascript" src="../js/settings.js"></script>
    <script type="text/javascript" src="../js/utils.js"></script>
    <script type="text/javascript" src="../js/settings_page.js"></script>
  </body>
 </html>
