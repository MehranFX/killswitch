<!DOCTYPE html>
<html>
  <head>
  	<link href="https://fonts.googleapis.com/css?family=Dosis" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="../css/popup.css" />
    <link type="text/css" rel="stylesheet" href="../css/ring_gif.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
  </head>
  <body>
  	<div align="center">
		<h1>Real Kill Switch</h1>
		<button id="settings_btn" title="Settings" aria-label="Settings" style="position:absolute; right:10px; top:10px; border:none; background:transparent; cursor:pointer; width:24px; height:24px; padding:0; display:flex; align-items:center; justify-content:center;">
			<img src="../img/gear.png" alt="settings" style="width:20px; height:20px; object-fit:contain;" />
		</button>
    </div>
  	<div align="center" id="content">
        <button>
            <a id="wl_domain" href="#">Whitelist this <strong>domain</strong> with IP</a>
        </button><br><br>
        <button>
            <a id="bl_domain" href="#">Blacklist this <strong>domain</strong> with IP</a>
        </button><br><br>
        <button>
            <a id="wl_url" href="#">Whitelist this <strong>page</strong> with IP</a>
        </button><br><br>
        <button>
            <a id="bl_url" href="#">Blacklist this <strong>page</strong> with IP</a>
        </button>
        <br><br>
        <button>
            <a id="country_rule" href="#">Whitelist / Blacklist this <strong>domain</strong> by <strong>country</strong></a>
        </button>
        
        <h2><a id="rules" href="#">MY RULES</a></h2>
        <div style="margin: 10px 0; font-size: 14px; font-weight: bold; color: #333; display:flex; align-items:center; justify-content:center; gap:8px;">
            <span>Current IP:</span>
            <span id="current_ip" class="ip" style="font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 6px; border-radius: 3px;">Loading...</span>
            <img id="refresh_icon" src="../img/refresh.png" alt="refresh" class="ip-refresh-icon" title="Refresh IP" />
        </div>
        
        <div id="location_info" class="status-card" style="margin: 8px 0; padding: 8px; background: #e8f4fd; border-radius: 5px; font-size: 12px; border-left: 3px solid #3498db;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span><strong>Location:</strong></span>
                <span id="location_text">Loading...</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span><strong>Timezone:</strong></span>
                <span id="timezone_text">Loading...</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span><strong>Locale:</strong></span>
                <span id="locale_text">Loading...</span>
            </div>
        </div>
        <div id="ip_status" style="margin: 10px 0; padding: 8px; background: #f0f0f0; border-radius: 5px; font-size: 12px;">
            <div>Next update in: <span id="countdown">--:--</span></div>
            <div>Status: <span id="ip_status_text">Loading...</span></div>
        </div>
        
    </div>
    <script type="text/javascript" src="../js/country_data.js"></script>
    <script type="text/javascript" src="../js/popup_flag_gradient.js"></script>
    <script type="text/javascript" src="../js/settings.js"></script>
    <script type="text/javascript" src="../js/popup.js"></script>
  </body>
</html>
