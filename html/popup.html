<!DOCTYPE html>
<html>
  <head>
  	<link href="https://fonts.googleapis.com/css?family=Dosis" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="../css/popup.css" />
    <link type="text/css" rel="stylesheet" href="../css/ring_gif.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
  </head>
  <body>
  	<div align="center">
		<h1>Kill Switch</h1>
		<button id="settings_btn" title="Settings" style="position:absolute; right:10px; top:10px; border:none; background:transparent; cursor:pointer; font-size:18px;">⚙️</button>
    </div>
  	<div align="center" id="content">
        <button>
            <a id="wl_domain" href="#">Whitelist this <strong>domain</strong> with IP</a>
        </button><br><br>
        <button>
            <a id="bl_domain" href="#">Blacklist this <strong>domain</strong> with IP</a>
        </button><br><br>
        <button>
            <a id="wl_url" href="#">Whitelist this <strong>page</strong> with IP</a>
        </button><br><br>
        <button>
            <a id="bl_url" href="#">Blacklist this <strong>page</strong> with IP</a>
        </button>
        <h2><a id="rules" href="#">MY RULES</a></h2>
        <div style="margin: 10px 0; font-size: 14px; font-weight: bold; color: #333;">
            Current IP: <span id="current_ip" class="ip" style="font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 6px; border-radius: 3px;">Loading...</span>
        </div>
        <div id="ip_status" style="margin: 10px 0; padding: 8px; background: #f0f0f0; border-radius: 5px; font-size: 12px;">
            <div>Next update in: <span id="countdown">--:--</span></div>
            <div>Status: <span id="ip_status_text">Loading...</span></div>
        </div>
        <button id="refresh_ip" style="margin-top: 10px; padding: 5px 10px; font-size: 12px;">🔄 Refresh IP</button>
        
    </div>
    <script type="text/javascript" src="../js/utils.js"></script>
    <script type="text/javascript" src="../js/settings.js"></script>
    <script type="text/javascript" src="../js/popup.js"></script>
  </body>
</html>
